# spec-large-self —— 大项目设计文档生成工作流
#
# 目标场景：功能模块多、复杂度高的项目。
# 核心结构：总文档在上，模块细化挂在同名子目录下。
#   proposal.md            模块清单（唯一契约）
#   design.md + design/    总设计方案 + 每模块细化设计
#   design-review.md       设计走查评审报告（4 维度评审组 + 1 走查验证组，共 5 个子 agent）
#   tasks.md  + tasks/     任务总控（阶段/串并行） + 每模块明细任务
#   tasks-review.md        任务评审报告（2 个子 agent 复审 tasks）
#
# 流水线：proposal → specs → design(总) → module-designs → design-review(交叉评审)
#         → tasks(总控) → module-tasks(明细) → tasks-review(任务评审门禁)
#
# 全局纪律（全流程适用）：**任何一份文档**更新后（任意方向、任意阶段），
# 必须同步更新其他所有受影响文档中的相关描述，保持全量内容一致——
# 不是只有 design→tasks 的单向同步；修改点均须登记备查。

name: spec-large-self
# v2 (2026-09-24): 新增 config.rules.yaml（schema 默认 rules 模板，自 soft-exam config.yaml 抽取通用化）
version: 2
description: 大项目工作流——总设计方案 + 模块细化设计 + 按依赖分阶段的任务拆分

artifacts:
  # ─────────────────────────────────────────────
  # ① proposal：为什么做 + 模块清单（全流程唯一契约）
  # ─────────────────────────────────────────────
  - id: proposal
    generates: proposal.md
    description: 提案文档——动机、变更内容、功能模块清单
    template: proposal.md
    instruction: |
      创建提案文档，回答"为什么做"并定下模块清单。

      章节要求：
      - **Why（为什么）**：1-2 句说清问题或机会，为什么现在做
      - **What Changes（做什么）**：变更点列表，破坏性变更标 **BREAKING**
      - **Capabilities（模块清单）**：本 schema 的核心契约，见下方专门规则
      - **非目标（Non-goals）**：明确本次不做什么，防止范围蔓延
      - **作用范围**：列出受影响的模块/包，以及明确不动的部分
      - **Impact（影响）**：受影响的代码、API、依赖、系统

      【模块清单规则】
      - 如果用户在需求中已自带模块清单：直接采纳，只做 kebab-case 规范化，
        不要擅自增删模块；有疑问先问用户
      - 如果用户没有给清单：根据需求自行推导拆分
      - 每个模块一行：`<kebab-case-name>`: 一句话职责
      - 必须包含一个通用模块 `common-core`（公共实体、工具、基础配置、
        统一错误码等所有功能模块共用的落地实现）；
        如果用户自定义清单里已有等价模块，沿用用户的命名
      - 跨模块的"约定"（接口契约、公共数据模型定义）不放这里，属于总 design.md

      【重要】Capabilities 章节是全流程唯一契约：specs、design、
      module-designs、tasks、module-tasks 都以这份清单为准，
      每个列出的模块后续都会有对应的 spec.md、design/<模块>.md、tasks/<模块>.md。
      填写前先调研现状，宁可少列也不要列了不做。

      保持 1-2 页以内，聚焦"为什么"而非"怎么做"。
    requires: []

  # ─────────────────────────────────────────────
  # ② specs：每模块一份全量需求规格（WHAT）
  # ─────────────────────────────────────────────
  - id: specs
    generates: "specs/*/spec.md"
    description: 每个功能模块的需求规格（全量写法）
    template: spec.md
    instruction: |
      为 proposal 的 Capabilities 清单中的**每一个模块**创建需求规格文件，
      路径：specs/<模块名>/spec.md（模块名与清单完全一致，kebab-case）。

      【全量写法，不用 delta 机制】
      直接写"这个模块最终要是什么样"，不使用
      ## ADDED/MODIFIED/REMOVED Requirements 标记。
      需求变更时直接修改对应 Requirement。

      格式要求：
      - 每条需求：`### Requirement: <名称>`，描述用 SHALL/MUST（避免 should/may）
      - 每个场景：`#### Scenario: <名称>`，WHEN/THEN 格式
      - **关键**：Scenario 必须用恰好 4 个井号（####），用 3 个或列表会静默解析失败
      - 每条 Requirement 至少配一个 Scenario
      - 场景必须覆盖正常、边界、异常三类中至少两类
      - 只写 WHAT 不写 HOW：不出现技术选型、表结构、类名等实现细节
        （那些属于 design/<模块>.md）

      每个场景都应该能直接转化为一个测试用例。
      common-core 模块同样要写 spec（如"统一响应格式""公共实体定义"等可验证需求）。
    requires:
      - proposal

  # ─────────────────────────────────────────────
  # ③ design：总设计方案（只写全局，不写模块内部）
  # ─────────────────────────────────────────────
  - id: design
    generates: design.md
    description: 总设计方案——架构、模块边界、跨模块契约
    template: design.md
    instruction: |
      创建总设计方案，只回答**全局层面**的 HOW，模块内部细节留给 design/<模块>.md。

      必须包含的章节：
      - **Context（背景）**：现状、约束、干系人
      - **Goals / Non-Goals**：本设计达成什么、明确排除什么
      - **模块划分与依赖图 + 执行顺序编号**：以 proposal 的 Capabilities 清单为准，
        画出模块间依赖关系（文字或 mermaid）；然后对依赖图做拓扑排序，
        给每个模块标**执行顺序编号**：有依赖的模块编号递增（串行），
        互相无依赖的模块共用同一编号（并行），形如 `1-2-2-3`。
        common-core 恒为 1，integration 恒为最后。
        该编号是全流程文档顺序的唯一来源：design/<模块>.md 头部标注、
        tasks.md 阶段号、tasks/<模块>.md 头部标注都直接引用，不得另行编号
      - **跨模块接口契约**：模块之间互相调用的接口定义（路径/方法/入参/出参/错误码）。
        这是各模块细化设计唯一引用来源，细化文档不得重复定义或私自更改
      - **公共数据模型**：被多个模块引用的核心实体（字段级定义）。
        字段表格的"说明"列必须填写业务含义（即列备注），不得留空；
        若以 DDL 形式给出公共表，必须带表备注和每一列的列备注
        （MySQL 用 COMMENT 子句，PostgreSQL 用 COMMENT ON TABLE/COLUMN 语句）
      - **横切规范**：统一错误码、鉴权方式、分页约定、命名规范等所有模块必须遵守的规则
      - **Decisions（技术决策）**：每个关键决策给出 2-3 个备选方案和取舍理由
      - **Risks / Trade-offs**：格式 [风险] → 缓解措施
      - **Open Questions**：待解决的未知项

      【纪律】
      - 涉及新依赖时必须说明版本和引入必要性（学习项目控制依赖数量）
      - 不要写单个模块的内部结构/表设计/API 明细——发现想写时，
        说明该内容属于 design/<模块>.md
      - 聚焦架构与方法，不做逐行实现设计
    requires:
      - specs

  # ─────────────────────────────────────────────
  # ④ module-designs：每模块一份细化设计（HOW）
  # ─────────────────────────────────────────────
  - id: module-designs
    generates: "design/*.md"
    description: 每个功能模块的细化设计方案
    template: module-design.md
    instruction: |
      为 Capabilities 清单中的**每一个模块**创建细化设计文档，
      路径：design/<模块名>.md（与 specs/<模块名>/ 一一对应）。

      每份文档必须包含：
      - **头部顺序标注**：正文第一行标注本模块的执行顺序编号
        （唯一来源：总 design.md 依赖图定下的编号，不得自行另编），格式：
        `> 执行顺序：N / 共 M ｜ 依赖：顺序 N-1（<模块>）｜ 并行：<同顺序模块，无则写"无">`，
        便于读者一眼看出该模块在整体方案中的阅读位置
      - **模块职责**：一句话 + 边界（做什么、不做什么）
      - **依赖的跨模块接口**：开头声明本模块用到总 design.md 中的哪些契约，
        只引用不重复定义；如需新增跨模块接口，先回总 design.md 补充
      - **内部结构**：包/类/文件组织，各自职责
      - **数据模型**：本模块私有的表结构（DDL 级），引用公共实体时注明出处。
        【强制】凡涉及表，DDL 必须带**表备注**和**每一列的列备注**，
        按目标数据库方言书写：
        · MySQL：列写 `<col> <type> ... COMMENT '列说明'`，
          表在建表语句结尾写 `) ... COMMENT='表说明';`
        · PostgreSQL/pgvector：建表后用独立语句
          `COMMENT ON TABLE <表名> IS '表说明';`、
          `COMMENT ON COLUMN <表名>.<列名> IS '列说明';`
        备注用简体中文说清业务含义（枚举取值/单位/取值范围也要写明），
        不得留空或只重复列名
      - **API 明细**：本模块对外暴露的接口（路径/入参/出参/错误码），
        跨模块接口必须与总 design.md 契约一致
      - **关键流程/算法**：核心逻辑的时序或伪代码
      - **测试要点**：对应 spec.md 的场景，列出测试策略与关键用例

      【纪律】
      - 按执行顺序编号从小到大逐模块生成：编号 1（common-core）最先写，
        同一编号（可并行）的模块先后不限；写某模块时以 proposal +
        该模块 spec.md + design.md（总）为输入，不需要等其他模块的细化设计
      - 遵守总 design.md 的横切规范，不得自创错误码/命名风格
    requires:
      - specs
      - design

  # ─────────────────────────────────────────────
  # ⑤ design-review：4 个维度评审组 + 1 个走查验证组（共 5 个子 agent）
  #    评审通过后才允许进入 tasks 阶段
  # ─────────────────────────────────────────────
  - id: design-review
    generates: design-review.md
    description: 设计走查评审报告——4 维度评审组（12 维度）+ 1 走查验证组交叉评审，闭环后方可进入 tasks
    template: design-review.md
    instruction: |
      module-designs 全部完成后、tasks 设计开始前，必须执行设计走查。
      模拟真实团队的设计评审：用 Agent 工具在**同一条消息里并行启动
      5 个子 agent**——4 个维度评审组（R1-R4，按维度分工覆盖 12 个
      评审维度）+ 1 个走查验证组（W，用推演手段验证）。
      评审对象：design.md（总）+ design/<模块>.md（全部），
      对照 proposal.md 与 specs/ 检查。

      【4 个维度评审组】（各组独立输出问题清单，互不通信）
      - R1 对齐与决策：
        · 需求符合性——设计是否覆盖 specs 全部 Requirement/Scenario、
          有无需求外的范围蔓延、每条需求可追溯到具体设计点
        · 架构合理性——模块边界与职责是否清晰、依赖方向是否正确、
          耦合内聚是否恰当、是否遵守总 design.md 横切规范
        · 决策与风险——关键决策是否有 2-3 个备选对比与取舍理由、
          新依赖是否说明版本与必要性、风险是否有缓解措施、
          Open Questions 是否收敛
      - R2 契约与数据：
        · 接口契约——API 要素完备（路径/方法/入参/出参/错误码/幂等性）、
          调用方与实现方对得上、模块细化设计与总 design.md 契约一致
        · 数据设计——表备注/列备注齐全、字段类型与约束恰当、
          必要索引、范式/反范式取舍有说明、数据生命周期（归档/清理）、
          双数据库（MySQL/pgvector）职责划分正确
        · 可测试性——"测试要点"章节是否覆盖本模块 spec 全部场景、
          mock 边界是否清晰、测试数据是否可构造
      - R3 防御：
        · 健壮性/可靠性——边界条件、异常路径、失败处理（超时/重试/降级）、
          并发与事务一致性、幂等、状态恢复
        · 安全——鉴权与越权（水平/垂直）、注入风险、敏感数据加密脱敏、
          输入校验、依赖已知漏洞
      - R4 质量属性：
        · 性能与扩展性——慢查询/N+1、大事务、热点数据、缓存策略、
          数据量增长后的表现、水平扩展空间
        · 可运维性——日志规范、线上排查手段、部署与回滚、配置管理
          （学习项目轻量评估：有日志和排查手段即可，不要求监控告警体系）
        · 可维护性/可演进性——命名与复杂度、后续演进空间、
          有无过度设计、文档间一致性

      【走查验证组 W】（独立于维度检查，用"推演"而非"清单"验证；
      主责维度 11 业务闭环性，同时为其他维度捕捞交界处问题）
      - 数据流转模拟：为每个核心业务场景（正常/边界/异常各至少 1 条）
        构造具体示例数据，沿设计链路走一遍
        （API 入参 → 服务处理 → 表落库/变更 → 下游模块），
        逐步记录数据形态变化，验证链路走通、状态能到达终态
      - 场景推演：取 specs 的典型用例过一遍设计（桌面检查），
        且每个核心场景**至少推演一个失败变体**
        （中途失败 / 重复提交 / 依赖不可用 / 并发冲突）
      - 发现的问题**标注归属维度（1-12）**，不限于闭环性

      【子 agent 通用约定】
      - 输入：proposal.md、specs/、design.md、design/<模块>.md 的文件路径
        + 本组的维度清单（或 W 组的推演要求）
      - 输出统一格式问题清单：
        | 编号 | 严重度(CRITICAL/HIGH/MEDIUM/LOW) | 归属维度(1-12) | 位置(文件§章节) | 问题描述 | 修复建议 |
      - 越界上报：发现不属于本组维度、但严重度 HIGH 及以上的问题，
        列入"其他发现"，由主流程归并到对应组去重

      【主流程汇总与通过标准】
      - 汇总 5 份报告，去重合并后写入 design-review.md；
        同一位置/同一问题被 ≥2 个组命中时，**严重度自动升一级**
        （最高至 CRITICAL）
      - 各组结论冲突时由主流程仲裁，仲裁理由记入 design-review.md
      - CRITICAL/HIGH 必须全部修复：修改对应设计文档（design.md 或
        design/<模块>.md），并在修复记录中登记；MEDIUM 尽量修复，
        不修复需写明理由；LOW 可忽略
      - 修复遵循全局全量一致纪律：改动任何一处后，其他受影响文档中
        的相关描述（如其他模块设计对该契约/公共实体的引用处）
        若因此过期，必须一并同步更新，不允许只改单份文件
      - 设计文档的修改由主流程统一执行，评审子 agent 只输出报告，
        避免多 agent 并发写同一文件
      - 每轮修复后复审：只对受影响的组重新启动子 agent，
        复查已修复问题与受影响章节，循环直到 CRITICAL/HIGH 清零
      - 保险丝：最多 3 轮；第 3 轮后仍有 CRITICAL/HIGH 未解决，
        停止并向用户输出剩余问题清单，等待指示
      - design-review.md 的评审结论写为**通过**后，才允许进入 tasks 阶段；
        未通过时不得生成 tasks.md / tasks/<模块>.md

      走查验证组的推演记录（示例数据、走查路径、每步数据变化、
      失败变体推演结论）完整保留在 design-review.md 中，作为评审证据。
    requires:
      - module-designs

  # ─────────────────────────────────────────────
  # ⑥ tasks：总控——执行顺序总览 + 模块级进度
  # ─────────────────────────────────────────────
  - id: tasks
    generates: tasks.md
    description: 任务总控——执行顺序总览表与模块级进度 checkbox
    template: tasks.md
    instruction: |
      创建任务总控文档。本文件是 openspec 进度追踪的唯一入口，
      只放总览和模块级 checkbox，明细任务在 tasks/<模块>.md（module-tasks 步骤生成）。

      必须包含：
      - **执行顺序总览表**：
        | 阶段 | 内容 | 方式 | 依赖 |
        阶段号直接采用总 design.md 依赖图定下的**执行顺序编号**，不得改动：
        · 阶段 1 = common-core 通用基础，串行，无依赖
        · 中间阶段 = 各功能模块，**同一编号的模块互为并行**（多行共用一个阶段号），
          不同编号按序串行，形如 1-2-2-3
        · 末阶段 = integration 集成联调，串行，编号最大，依赖所有前序阶段
      - **模块进度清单**（checkbox 格式，apply 阶段解析的就是这些，
        按阶段号从小到大排列）：
        ## 模块进度
        - [ ] common-core（tasks/common-core.md）—— 阶段1，串行
        - [ ] <模块名>（tasks/<模块名>.md）—— 阶段N，可与<同阶段模块>并行
        - [ ] integration（tasks/integration.md）—— 阶段M（末），串行

      【重要】每个模块项必须是一个 checkbox（`- [ ]`），
      指向对应的 tasks/<模块>.md 明细文件；本文件不写具体任务明细。
      模块项的勾选时机：对应明细文件内所有任务全部完成。
    requires:
      - design-review

  # ─────────────────────────────────────────────
  # ⑦ module-tasks：每模块一份明细任务清单
  # ─────────────────────────────────────────────
  - id: module-tasks
    generates: "tasks/*.md"
    description: 每个模块的明细任务清单 + 集成联调清单
    template: module-tasks.md
    instruction: |
      为 tasks.md 总览表中的**每一项**创建明细任务文件：
      - 每个模块一个文件：tasks/<模块名>.md（含 common-core）
      - 收尾单独一个文件：tasks/integration.md（跨模块端到端联调、整体回归、部署验证）

      格式要求（apply 阶段靠 checkbox 追踪，必须严格遵守）：
      - 文件开头注明：执行顺序编号（= tasks.md 总览的阶段号，
        同 design/<模块>.md 头部标注）、串行/可并行（列出同编号的并行模块）、
        依赖哪些顺序
      - 任务分组用 ## 数字标题，每条任务必须是 checkbox：`- [ ] X.Y 任务描述`
      - X 用该模块的执行顺序编号；同编号的并行模块各自独立成文件，
        任务编号只需保证本文件内不重复
      - 任务按依赖顺序排列（先做什么后做什么）

      任务粒度纪律：
      - 每个任务不超过 2 小时
      - 每个任务必须附带验证命令（如 ./mvnw test -Dtest=XxxTest）
      - 接口和实现放在同一个任务中，避免编译中断
      - 每条任务可独立验证——做完就能确认对错
      - 任务内容以 design/<模块>.md 为依据，覆盖该模块 spec.md 的全部 Requirement

      integration.md 的任务依赖所有功能模块完成，写清端到端验证场景。
    requires:
      - tasks

  # ─────────────────────────────────────────────
  # ⑧ tasks-review：2 个子 agent 复审 tasks（评审门禁）
  #    通过后才算 apply 就绪，防止"设计对、任务写错/过期"污染编码
  # ─────────────────────────────────────────────
  - id: tasks-review
    generates: tasks-review.md
    description: 任务评审报告——TR1 覆盖率复审 + TR2 语义一致复审，闭环后方可进入 apply
    template: tasks-review.md
    instruction: |
      module-tasks 全部生成后、apply 开始前，必须对 tasks 本身做一轮评审。
      用 Agent 工具在**同一条消息里并行启动 2 个子 agent**：

      【TR1 覆盖率复审】（对应 design-review R1 视角）
      - specs 的每条 Requirement/**Scenario** 在 tasks/<模块>.md
        或设计"测试要点"表中有落点，不允许 Scenario 级遗漏
      - design-review 的修复结论没有在 tasks 中丢失：抽查修复记录中
        "已修复"的问题，对应任务内容体现的是修复后的设计
      - tasks.md 与 tasks/<模块>.md 的头部顺序编号/串并行标注
        与 design.md 依赖图一致

      【TR2 语义一致复审】（对应 design-review R2 视角）
      - 逐条任务与 design/<模块>.md 对应章节比对：要建的表
        （DDL 要素/索引/约束/表列备注）、要实现的接口（路径/出入参/
        错误码）、引用的字段与枚举值、流程步骤——不矛盾、不是旧版本
      - 任务可执行性：验证命令与要产出的测试类对得上、
        接口与实现在同一任务、粒度 ≤2 小时、按依赖顺序排列

      【通用约定】
      - 输入：specs/、design.md、design/*.md、design-review.md、
        tasks.md、tasks/*.md 的文件路径 + 本组检查清单
      - 输出统一格式问题清单：
        | 编号 | 严重度(CRITICAL/HIGH/MEDIUM/LOW) | 位置(文件§条目) | 问题描述 | 修复建议 |
      - 越界上报：顺带发现**设计文档本身**的问题（design-review 漏网的），
        单独列入"跨界发现"

      【处理与通过标准】
      - 主流程汇总 2 份报告，去重合并写入 tasks-review.md；
        CRITICAL/HIGH 必须全部修复，MEDIUM 尽量修复（不修复写理由），
        LOW 可忽略；tasks/<模块>.md 的修改由主流程统一执行，
        复审子 agent 只出报告
      - 跨界发现属设计文档问题时：回改设计文档并重跑 design-review
        受影响评审组复审，再同步修改 tasks，两条评审线都闭环
      - 每轮修复后只对受影响模块复审，循环直到 CRITICAL/HIGH 清零；
        保险丝最多 2 轮，超限输出剩余问题清单等待用户指示
      - tasks-review.md 结论写为**通过**后，才算 apply 就绪；
        未通过时不得开始编码

      与 apply 第 0 步的关系：本步是 tasks 生成时的**入口门禁**，
      apply 第 0 步是编码前的**最终防线**，二者独立执行、不可互替。
    requires:
      - module-tasks

# ─────────────────────────────────────────────
# apply：写代码阶段
# ─────────────────────────────────────────────
apply:
  requires: [tasks-review]
  tracks: tasks.md
  instruction: |
    apply 阶段分三步执行：一致性校验 → TDD 编码 → OCR 质量闭环。
    任何一步不得跳过。

    ══ 第 0 步：apply 前一致性校验（强制） ══
    校验范围：变更目录下**所有文档**——proposal.md、specs/**、design.md、
    design/*.md、design-review.md、tasks.md、tasks/*.md，一个不漏。
    校验两层：结构一致（a-f，有明确锚点、可机械核对）
    + 语义一致（g-i，同一件事不允许 A 文档说东、B 文档说西）。
    重点核对：
    a. 模块清单一一对应：proposal 的 Capabilities = specs/<模块>/ 目录
       = design/<模块>.md 文件 = tasks.md 模块进度项 = tasks/<模块>.md 文件，
       不缺、不多、命名一致
    b. 跨模块接口契约：design.md 的契约与各 design/<模块>.md 的 API 明细
       在路径/入参/出参/错误码上完全一致
    c. 需求覆盖：specs 的每条 Requirement 在 design/<模块>.md 有对应设计、
       在 tasks/<模块>.md 有对应任务
    d. 顺序编号一致：design.md 依赖图的执行顺序编号
       = design/<模块>.md 头部标注 = tasks.md 总览表阶段号
       = tasks/<模块>.md 头部标注，四处完全一致；
       且"同编号并行、不同编号串行"的关系在四处表述一致
    e. 横切规范：各模块设计及其 tasks 的错误码/命名/分页等
       遵守 design.md 横切规范
    f. 评审闭环：design-review.md 与 tasks-review.md 均存在且
       评审结论为**通过**，CRITICAL/HIGH 问题全部修复并复审
    g. 评审修复落地：design-review.md 修复记录中每条"已修复/复审通过"
       的问题，都能在对应设计文档中找到实际改动——
       防止"报告登记已修复、文档实际没改"
    h. 跨文档语义一致：同一件事——实体字段与枚举值、状态流转、
       接口行为、流程步骤、业务规则——在**所有提及它的文档**中
       说法一致，不得互相矛盾。至少按两条线抽查：
       · 实体线：公共数据模型的每个实体，design.md 定义 →
         各 design/<模块>.md 引用处 → tasks 中的建表/字段描述，
         字段名/类型/枚举取值处处一致
       · 流程线：每条核心业务流程，spec Scenario 描述的行为 →
         design 的流程/时序设计 → tasks 的任务项描述，
         行为一致（含 design-review 修复后的最新结论）
    i. tasks↔design 语义一致：tasks/<模块>.md 每条任务的内容
       （要建的表、要实现的接口、引用的字段/规则）与
       design/<模块>.md 对应章节不矛盾、不是旧版本；
       spec 的每个 Scenario 在任务项或设计"测试要点"表中
       有明确落点，不允许 Scenario 级遗漏

    处理规则：
    - 发现不一致：自行修复。修复方向以上游文档为准
      （proposal > specs > design > module-designs > tasks > module-tasks），
      下游向上游对齐；若下游存在合理的新信息未同步到上游，则同步更新上游
    - 修复遵循全局全量一致纪律：改动任何一份文档后，其他所有受影响
      文档中的相关描述一并同步更新，全部改完后重新执行本步校验
    - 修复后输出【修改点清单】：文件、位置、改动内容、修复理由，
      等用户确认没问题后再主动开始编码
    - 全部一致：报告"一致性校验通过"，直接进入第 1 步，无需等待确认

    ══ 第 1 步：TDD 编码（强制 superpowers TDD 模式） ══
    开始编码前，必须先用 Skill 工具调用 superpowers 的
    `test-driven-development` 技能，严格 RED → GREEN → REFACTOR：
    先写失败的测试，再写让测试通过的最简实现，最后重构。
    禁止跳过测试直接写实现代码。

    测试源头锚定（防止任务文本写错带偏测试）：
    - 测试用例一律以 **spec 场景 + design/<模块>.md「测试要点」表**
      为准，任务描述只是执行入口索引；任务描述与设计/spec 冲突时，
      以设计/spec 为准执行，并按执行纪律第 6 条回头修正任务文本
    - 设计「测试要点」表中列出的场景对应测试一个都不能省，
      不允许因"任务里没提到"而遗漏

    执行纪律（按 tasks.md 总览表的阶段顺序推进）：
    1. 读 tasks.md，确认当前可执行的阶段（编号更小的阶段全部勾完才算可执行）
    2. 打开该阶段对应的 tasks/<模块>.md，逐条执行明细任务，完成一条勾一条
    3. 同一阶段（同一编号）内的模块互为并行，可按任意顺序或穿插执行；
       不同阶段的模块必须按编号先后串行
    4. 某模块明细文件全部勾完后，回 tasks.md 勾掉对应模块项
    5. 不得跨阶段抢跑；集成联调（integration.md）必须等所有功能模块勾完
    6. 实现时以 design/<模块>.md 为准；发现任何文档与现实冲突、
       或文档之间互相冲突，先改文档再改代码，保持文档与代码一致
    7. 全量一致纪律：任何一份文档（proposal/specs/design/
       design-review/tasks/tasks-review，任意方向）一经更新，
       必须同步更新其他所有受影响文档中的相关描述，并在
       【修改点清单】登记，保持全量内容一致——不允许只做
       design→tasks 之类的单向同步；若改动涉及跨模块契约或
       公共数据模型，须重跑 design-review / tasks-review
       受影响评审组复审通过后，才能继续编码
    遇到阻塞或需求不明确时暂停并向用户确认，不要自行脑补。

    ══ 第 2 步：apply 结束后 OCR 质量闭环（强制） ══
    所有任务勾完后，调用 `open-code-review` 技能执行审查-修复循环：
    1. 审查：ocr review --audience agent -b "<业务上下文>"，
       业务上下文从 proposal.md 的 Why/What Changes 与 design.md 摘要提炼
    2. 修复：按报告自动修复 critical / high / medium 级问题
       （low 级忽略，避免误报噪音）；
       每轮修复后运行 ./mvnw test 确认全量测试通过
    3. 复审：再次 ocr review，循环直到 critical/high/medium 问题为零
    4. 保险丝：最多 3 轮循环；第 3 轮后仍有未解决问题，
       停止并向用户输出剩余问题清单，等待指示
    5. 收尾：输出审查结论（循环轮数、各级修复数量、最终测试状态）

    单阶段代码量大时（diff 文件多），可在每个阶段完成后先跑一轮
    OCR 小循环，最后收尾时再全量执行一次。
